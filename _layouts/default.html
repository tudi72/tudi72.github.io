<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7V9DJ74CCG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-7V9DJ74CCG');
    </script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />

    <style>
      .info-line {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 1em;
      }

      .info-line a {
        text-decoration: none;
        color: inherit;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .info-line a:hover {
        opacity: 0.75;
      }
      .profile-logo {
        width: 200px;       /* Adjust size as needed */
        height: 200px;
        object-fit: cover;
        border-radius: 50%; /* Makes it round */
        margin-top: 10px;
        border: 2px solid #ccc; /* Optional border */
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

        {% if site.logo %}
          <img src="{{site.logo | relative_url}}" alt="Logo" class="profile-logo" />

        {% endif %}

        <p>{{ site.description | default: site.github.project_tagline }}</p>

        <!-- 📍 Location -->
        <div class="info-line">
          <i class="fas fa-map-marker-alt" style="color: black;"></i>
          <span>{{ site.location | default: "Your City, Country" }}</span>
        </div>

        <!-- 📫 Email -->
        <div class="info-line">
          <a href="mailto:your.email@example.com" title="Email">
            <i class="fas fa-envelope" style="color: black;"></i>
            <span>Email</span>
          </a>
        </div>

        <!-- 🔗 LinkedIn -->
        <div class="info-line">
          <a href="{{ site.linkedin_url | default: '#' }}" target="_blank" title="LinkedIn">
            <i class="fab fa-linkedin"></i>
            <span>LinkedIn</span>
          </a>
        </div>

        <!-- 🐙 GitHub -->
        <div class="info-line">
          <a href="{{ site.github_url | default: site.github.owner_url }}" target="_blank" title="GitHub">
            <i class="fab fa-github" style="color: black;"></i>
            <span>GitHub</span>
          </a>
        </div>
      </header>

      <section>
        {{ content }}
      </section>
